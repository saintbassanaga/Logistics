services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistics}
      POSTGRES_USER: ${POSTGRES_USER:-transport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_dev_password_12345}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transport_user} -d ${POSTGRES_DB:-logistics}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - logistics-network

volumes:
  postgres_data:
    driver: local

networks:
  logistics-network:
    driver: bridge
