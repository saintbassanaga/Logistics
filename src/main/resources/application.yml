spring:
  application:
    name: Logistics

  profiles:
    active: local

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/logistics}
    username: ${POSTGRES_USER:transport_user}
    password: ${POSTGRES_PASSWORD:transport_dev_password_12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Spring Security: Resource Server validates tokens issued by our own AS
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_ISSUER_URI:http://localhost:8081}
          # jwk-set-uri is NOT needed — JwtDecoder is provided directly from the
          # in-memory JWKSource bean, avoiding the chicken-and-egg startup issue.

  web:
    error:
      include-message: always
      include-binding-errors: always

# Spring Authorization Server settings
app:
  security:
    issuer: ${APP_ISSUER_URI:http://localhost:8081}
    # Keystore for RSA signing keys (leave empty to generate ephemeral key — dev only)
    keystore:
      path: ${KEY_STORE_PATH:}
      password: ${KEY_STORE_PASSWORD:}
      alias: ${KEY_STORE_ALIAS:logistics-signing-key}
    # Initial secret for the logistics-service client (change in production)
    service-client:
      secret: ${SERVICE_CLIENT_SECRET:logistics-service-secret-change-in-prod}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    tech.bytesmind.logistics: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    oauth:
      client-id: logistics-angular
      use-pkce-with-authorization-code-grant: true
    oauth2-redirect-url: http://localhost:8081/swagger-ui/oauth2-redirect.html
